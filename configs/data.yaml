# 数据与实验配置
# 说明：所有硬编码路径、时间范围、站点范围集中在此，代码中不得重复定义。

project:
  name: air-quality-stgnn-platform
  city: beijing

# 空气质量数据源（2026-11 实测验证）
air_quality:
  primary:
    name: quotsoft
    product: china_sites          # 全国监测点，全 6 项污染物，列名为站点编码
    url_pattern: "https://quotsoft.net/air/data/china_sites_{date}.csv"
    granularity: hourly
    encoding: utf-8
    approx_size_per_day_mb: 1.9
  beijing_fallback:               # 备用：北京站数据，PM2.5/PM10/AQI 与 SO2/NO2/O3/CO 分两个文件
    - product: beijing_all
      contains: [pm25, pm10, aqi]
    - product: beijing_extra
      contains: [so2, no2, o3, co]
  station_list:
    file: data/raw/stations.csv   # 需手动从 quotsoft 首页网盘下载（字段：编码,名称,城市,经度,纬度,对照点）
    required: true                # china_sites 列名为编码，必须与此表 join 才能得到坐标
  cross_check:
    name: resdc
    url: "https://www.resdc.cn/data.aspx?DATAID=289"
    require_login: true

# 气象数据源（ERA5-Land，按北京范围裁剪下载）
meteorology:
  source: cds
  dataset: reanalysis-era5-land
  resolution_deg: 0.1
  variables:
    - 2m_temperature          # temp
    - 2m_dewpoint_temperature # -> rh
    - 10m_u_component_of_wind # -> ws/wd
    - 10m_v_component_of_wind
    - surface_pressure        # pres
  area: [41.1, 115.4, 39.4, 117.6]   # [N, W, S, E] 北京及周边

# 时空范围
scope:
  stations: beijing_24            # 2021.01.01 版清单中的北京 24 个国控站，节点集在 4 年内固定
  station_list_version: "2021.01.01"
  excluded_note: "北京 2024 年已增至 35 站，新增 11 站因前期数据缺失不入主实验"
  start: "2021-01-01"
  end: "2024-12-31"
  freq: "1h"

# 数据切分（按自然年边界）
split:
  train: ["2021-01-01", "2022-12-31"]
  valid: ["2023-01-01", "2023-12-31"]
  test:  ["2024-01-01", "2024-12-31"]

# 特征
features:
  pollutants: [pm25, pm10, no2, o3]
  meteorology: [temp, rh, ws, wd, pres]
  input_channels: 9       # 4 污染物 + 5 气象
  input_window_h: 24
  horizons_h: [1, 3, 6, 12, 24]

# 建模方式：4 个独立单输出模型
modeling:
  scheme: single_output_per_pollutant
  targets: [pm25, pm10, no2, o3]

# 路径（相对于项目根）
paths:
  raw: data/raw
  processed: data/processed
  runs: runs
  checkpoints: checkpoints
  logs: logs

# 关联网络
network:
  methods: [transfer_entropy, lagged_correlation]
  embedding_dim: 2
  lag_candidates_h: [1, 2, 3, 4]
  surrogate_test: true
  fdr_correction: true

# 分级标准
grading:
  standard: "GB 3095-2012"
  level: second           # 二级浓度限值
  disclaimer: "辅助研判提示，不等同于官方预警"
